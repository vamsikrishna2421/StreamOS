<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StreamOS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0e14'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='%234da3ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
<!-- hls.js is vendored locally so the hub plays LAN streams with no internet -->
<script src="/vendor/hls.min.js"></script>
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div class="brand">Stream<span>OS</span></div>
    <!-- nav items injected by app.js -->
  </nav>
  <main id="main"></main>
</div>

<div id="player">
  <div class="bar">
    <div class="title" id="pl-title"></div>
    <button class="btn ghost" id="pl-close">Close (Back)</button>
  </div>
  <video id="pl-video" controls autoplay playsinline></video>
</div>

<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
